[functions.create-lead]
verify_jwt = false

# Called from the public confirmation page with the anon key after a lead uploads
# their declarations page; authenticated by lead_id + storage-path ownership, not a JWT.
[functions.parse-declaration-pdf]
verify_jwt = false

[functions.canopy-webhook]
verify_jwt = false

# Stripe calls this server-to-server; it is authenticated by the
# Stripe-Signature header, not a Supabase JWT.
[functions.dd-stripe-webhook]
verify_jwt = false

# Public /ratecheck page posts dec-page photos here with the publishable key;
# guarded by consent validation + DB rate limiting, not a JWT.
[functions.rate-check]
verify_jwt = false

# Agent-only: records the Allstate quote; requires a user JWT.
[functions.rate-check-outcome]
verify_jwt = true

# Invoked daily by pg_cron (no secret in the DB); input-free and idempotent —
# it only purges dec-page images older than 90 days.
[functions.rate-check-cleanup]
verify_jwt = false

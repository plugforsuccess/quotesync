      "@type": "WebPage",
      "name": "insuredbycam - Auto Insurance Quotes Georgia",

            }
          },
          {
            "@type": "Question",
            "name": "What is a declarations page?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "It's the summary page of your current policy: your coverages, limits, deductibles and price. Your insurer's app or website has it, usually under Documents."
            }
          },
          {
            "@type": "Question",
            "name": "Do I need to have current auto insurance?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, this service works by comparing your existing policy to an Allstate quote. You must have active auto insurance to use this process."
            }
          },
          {
            "@type": "Question",
            "name": "What areas does insuredbycam serve?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Currently serving Georgia residents only. If you're interested in coverage elsewhere, DM @insuredbycam on Instagram."
            }
          }
        ]
      }
    }
    </script>
